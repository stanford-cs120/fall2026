<svg xmlns="http://www.w3.org/2000/svg" width="650" height="508" viewBox="0 0 650 508" role="img" aria-labelledby="note8-delayed-feedback-title note8-delayed-feedback-desc">
  <title id="note8-delayed-feedback-title">Delayed feedback and repeated action</title>
  <desc id="note8-delayed-feedback-desc">The merchant has committed an order, but its status response is delayed. The ordering policy submits again, producing two charges. The hazardous condition is an unresolved, partially observed transaction that still permits consequential repeat actions. The possible harm is unwanted additional purchases. This is a hypothetical schematic, not empirical evidence. Text labels identify the depicted interactions.</desc>
  <defs>
    <marker id="ink-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#202020" />
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#606060" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#09588D" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#B3202C" />
    </marker>
  </defs>
  <rect x="0" y="0" width="650" height="508" fill="white" />
  <g transform="translate(0,-179)" id="delayed-feedback">
    <rect x="12" y="191" width="626" height="484" fill="#F7F7F7" stroke="#979797" stroke-width="1.35" />
    <text x="28" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#606060" text-anchor="start">Ordering-system boundary</text>
    <rect x="38" y="266" width="170" height="174" fill="#F2E7BA" stroke="#202020" stroke-width="1.6" />
    <text x="123.0" y="297" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#202020" text-anchor="middle">Ordering policy</text>
    <text x="123.0" y="363" font-family="DejaVu Serif" font-size="45" fill="#202020" text-anchor="middle" font-style="italic">π</text>
    <text x="123.0" y="417" font-family="Arial, Helvetica, sans-serif" font-size="19.5" fill="#202020" text-anchor="middle">no confirmation</text>
    <rect x="450" y="266" width="164" height="174" fill="white" stroke="#979797" stroke-width="1.5" />
    <text x="532" y="297" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202020" text-anchor="middle">Merchant</text>
    <text x="532" y="352" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#202020" text-anchor="middle">order already</text>
    <text x="532" y="380" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#202020" text-anchor="middle">committed</text>
    <path d="M 208 294 H 450" fill="none" stroke="#202020" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ink-arrow)" />
    <text x="329" y="281" font-family="Arial, Helvetica, sans-serif" font-size="20.5" fill="#202020" text-anchor="middle">1. Submit order</text>
    <path d="M 450 356 H 208" fill="none" stroke="#09588D" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#blue-arrow)" stroke-dasharray="7 6" />
    <text x="329" y="341" font-family="Arial, Helvetica, sans-serif" font-size="20.5" fill="#09588D" text-anchor="middle">2. Status delayed</text>
    <path d="M 208 419 H 450" fill="none" stroke="#B3202C" stroke-width="2" stroke-linejoin="round" marker-end="url(#red-arrow)" />
    <text x="329" y="404" font-family="Arial, Helvetica, sans-serif" font-size="20.5" fill="#B3202C" text-anchor="middle">3. Submit again</text>
    <text x="40" y="513" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#606060" text-anchor="start">No refreshed status</text>
    <text x="40" y="542" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#606060" text-anchor="start">before the next action.</text>
    <path d="M 532 440 V 478 H 437 V 520" fill="none" stroke="#202020" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ink-arrow)" />
    <path d="M 532 478 H 565 V 520" fill="none" stroke="#B3202C" stroke-width="2" stroke-linejoin="round" marker-end="url(#red-arrow)" />
    <rect x="384" y="520" width="108" height="78" fill="white" stroke="#979797" stroke-width="1.5" />
    <rect x="512" y="520" width="108" height="78" fill="white" stroke="#B3202C" stroke-width="1.5" />
    <text x="438" y="550" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#202020" text-anchor="middle">Order 1</text>
    <text x="438" y="578" font-family="Arial, Helvetica, sans-serif" font-size="18.5" fill="#202020" text-anchor="middle">charged</text>
    <text x="566" y="550" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#B3202C" text-anchor="middle">Order 2</text>
    <text x="566" y="578" font-family="Arial, Helvetica, sans-serif" font-size="18.5" fill="#B3202C" text-anchor="middle">charged</text>
    <text x="325" y="649" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#606060" text-anchor="middle">Confirmation lags behind commitment</text>
  </g>
</svg>
