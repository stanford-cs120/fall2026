<svg xmlns="http://www.w3.org/2000/svg" width="630" height="435" viewBox="0 0 630 435" role="img" aria-labelledby="note8-development-boundary-title note8-development-boundary-desc">
  <title id="note8-development-boundary-title">Exploration reaches outside the development boundary</title>
  <desc id="note8-development-boundary-desc">A candidate policy sees no charges from test orders, retries and waits, then posts requests through a shared channel. Other agents with live permissions return order status. Indirect access crosses the development boundary and can leak customer information. This is a hypothetical schematic, not empirical evidence. Text labels identify the depicted interactions.</desc>
  <defs>
    <marker id="ink-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#202020" />
    </marker>
    <marker id="gray-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#606060" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#09588D" />
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 4 L 0 8 L 2.7 4 Z" fill="#B3202C" />
    </marker>
  </defs>
  <rect x="0" y="0" width="630" height="435" fill="white" />
  <g transform="translate(-10,-272)" id="development-boundary">
    <rect x="22" y="284" width="264" height="314" fill="#F7F7F7" stroke="#979797" stroke-width="1.35" stroke-dasharray="7 5" />
    <text x="38" y="309" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#606060" text-anchor="start">Development boundary</text>
    <rect x="352" y="284" width="276" height="314" fill="#F7F7F7" stroke="#979797" stroke-width="1.35" />
    <text x="368" y="309" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#606060" text-anchor="start">Production permissions</text>
    <rect x="58" y="366" width="190" height="112" fill="#F2E7BA" stroke="#202020" stroke-width="1.6" />
    <text x="153.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#202020" text-anchor="middle">Candidate policy</text>
    <text x="153.0" y="447" font-family="DejaVu Serif" font-size="45" fill="#202020" text-anchor="middle" font-style="italic">π</text>
    <rect x="384" y="366" width="210" height="112" fill="white" stroke="#979797" stroke-width="1.5" />
    <text x="489" y="404" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202020" text-anchor="middle">Other agents</text>
    <text x="489" y="441" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#202020" text-anchor="middle">with live permissions</text>
    <path d="M 489 366 V 355 H 153 V 366" fill="none" stroke="#09588D" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue-arrow)" />
    <text x="489" y="348" font-family="Arial, Helvetica, sans-serif" font-size="20.5" fill="#09588D" text-anchor="middle">Live order status</text>
    <path d="M 91 478 V 575 H 215 V 478" fill="none" stroke="#202020" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ink-arrow)" />
    <text x="153" y="520" font-family="Arial, Helvetica, sans-serif" font-size="19.5" fill="#09588D" text-anchor="middle">No charges</text>
    <text x="153" y="548" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#606060" text-anchor="middle">retry / wait</text>
    <rect x="352" y="631" width="244" height="64" fill="white" stroke="#979797" stroke-width="1.5" />
    <text x="474" y="670" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202020" text-anchor="middle">Shared channel</text>
    <path d="M 248 431 H 311 V 663 H 352" fill="none" stroke="#202020" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ink-arrow)" />
    <text x="299" y="625" font-family="Arial, Helvetica, sans-serif" font-size="19.5" fill="#202020" text-anchor="end">Post requests</text>
    <path d="M 552 631 V 478" fill="none" stroke="#202020" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#ink-arrow)" />
    <text x="540" y="561" font-family="Arial, Helvetica, sans-serif" font-size="19.5" fill="#202020" text-anchor="end">Prompt</text>
  </g>
</svg>
