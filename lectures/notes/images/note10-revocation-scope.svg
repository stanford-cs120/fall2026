<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
  <title id="title">Revocation must cover every purchase path</title>
  <desc id="desc">Hypothetical ordering-system schematic. A user revokes purchasing permission. Dashed red lines mark required revocation coverage over the policy process, pending orders and retries, and recurring subscription renewals. Solid arrows show that all three can send order attempts to a merchant or payment service. Stopping the policy process alone does not cancel the other paths. Already committed orders require separate handling. The diagram states a proposed safety requirement, not an implemented safeguard.</desc>
  <defs>
    <marker id="order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#374151"/>
    </marker>
    <marker id="revoke" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8c1515"/>
    </marker>
  </defs>
  <rect width="640" height="610" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#202124">
    <rect x="142" y="20" width="356" height="76" rx="10" fill="#fdf2f2" stroke="#8c1515" stroke-width="2"/>
    <text x="320" y="51" font-size="21" font-weight="bold">User revokes</text>
    <text x="320" y="78" font-size="21">purchasing permission</text>

    <text x="320" y="149" font-size="19" fill="#8c1515">Required revocation coverage</text>
    <text x="320" y="174" font-size="17" fill="#555">(a requirement, not an installed control)</text>

    <g fill="none" stroke="#8c1515" stroke-width="2.5" stroke-dasharray="7 5">
      <path d="M 320 96 V 122"/>
      <path d="M 320 187 V 206 H 110 V 239" marker-end="url(#revoke)"/>
      <path d="M 320 206 V 239" marker-end="url(#revoke)"/>
      <path d="M 320 206 H 530 V 239" marker-end="url(#revoke)"/>
    </g>

    <g fill="#f3f4f6" stroke="#374151" stroke-width="2">
      <rect x="18" y="242" width="184" height="105" rx="8"/>
      <rect x="228" y="242" width="184" height="105" rx="8"/>
      <rect x="438" y="242" width="184" height="105" rx="8"/>
    </g>
    <g font-size="18" font-weight="bold">
      <text x="110" y="274">Policy process</text>
      <text x="320" y="274">Pending work</text>
      <text x="530" y="274">Recurring service</text>
    </g>
    <g font-size="17">
      <text x="110" y="303">New purchase</text>
      <text x="110" y="327">requests</text>
      <text x="320" y="303">Queued orders</text>
      <text x="320" y="327">and retries</text>
      <text x="530" y="303">Subscription</text>
      <text x="530" y="327">renewals</text>
    </g>

    <g fill="none" stroke="#374151" stroke-width="2.5">
      <path d="M 110 347 V 392 H 320"/>
      <path d="M 530 347 V 392 H 320"/>
      <path d="M 320 347 V 448" marker-end="url(#order)"/>
    </g>
    <text x="423" y="426" font-size="18">Order attempts</text>

    <rect x="110" y="452" width="420" height="84" rx="10" fill="#eef5fb" stroke="#374151" stroke-width="2"/>
    <text x="320" y="485" font-size="21" font-weight="bold">Merchant / payment service</text>
    <text x="320" y="514" font-size="19">Order commitment and charge</text>

    <text x="320" y="578" font-size="18">Already committed orders need separate handling.</text>
  </g>
</svg>